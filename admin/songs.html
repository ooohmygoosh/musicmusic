<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Song Library | TPY Admin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Song Library</h1>
        <nav class="nav">
          <a href="/" class="nav-link">Overview</a>
          <a href="/songs.html" class="nav-link is-active">Songs</a>
          <a href="/users.html" class="nav-link">Users</a>
          <a href="/tags.html" class="nav-link">Tags</a>
        </nav>
        <div class="token">
          <input id="token" type="password" placeholder="Admin Token" />
          <button id="saveToken">Save</button>
        </div>
      </header>

      <section class="card">
        <div class="row between">
          <h2>Library Songs</h2>
          <div class="row">
            <button id="refreshSongs">Refresh</button>
            <button id="bulkDeleteSongs" class="ghost-btn">Bulk Delete (files)</button>
          </div>
        </div>
        <div class="toolbar row">
          <input id="searchInput" placeholder="Search title, prompt, tags, or owner" />
          <select id="availabilityFilter">
            <option value="">All status</option>
            <option value="true">Enabled only</option>
            <option value="false">Disabled only</option>
          </select>
          <select id="creatorTypeFilter">
            <option value="">All owners</option>
            <option value="user">User generated</option>
            <option value="official">Official fallback</option>
          </select>
          <select id="sourceFilter">
            <option value="">All sources</option>
            <option value="portrait_manual">Manual generation</option>
            <option value="recommend_fallback">Recommend fallback</option>
            <option value="legacy">Legacy</option>
          </select>
          <select id="visibilityFilter">
            <option value="">All visibility</option>
            <option value="public">Public</option>
            <option value="private">Private</option>
          </select>
          <select id="tagCategoryFilter">
            <option value="">All categories</option>
          </select>
          <select id="tagFilter">
            <option value="">All tags</option>
          </select>
          <select id="sortByFilter">
            <option value="created_at">Newest</option>
            <option value="id">Song ID</option>
            <option value="deliveries">Deliveries</option>
            <option value="likes">Likes</option>
            <option value="reuse_count">Reuse</option>
            <option value="title">Title</option>
          </select>
          <select id="sortDirFilter">
            <option value="desc">Desc</option>
            <option value="asc">Asc</option>
          </select>
        </div>
        <div class="table library-table-wrap">
          <table class="library-table">
            <thead>
              <tr>
                <th></th>
                <th>Select</th>
                <th>ID</th>
                <th>Created</th>
                <th>Title</th>
                <th>Tags</th>
                <th>Owner</th>
                <th>Source</th>
                <th>Public</th>
                <th>Disabled</th>
                <th>Stats</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="songList"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="./songs.js"></script>
  </body>
</html>
